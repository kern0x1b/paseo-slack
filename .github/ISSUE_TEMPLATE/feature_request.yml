name: Feature Request
description: Suggest an idea or enhancement for paseo-slack
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve paseo-slack!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you would like.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you have considered.
